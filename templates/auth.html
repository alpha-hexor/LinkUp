<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <style>
        /* Loading spinner styles */
        #lds-roller,
        #lds-roller div,
        #lds-roller div:after {
            box-sizing: border-box;
        }
        #lds-roller {
            display: none; /* Hide spinner by default */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            z-index: 1000;
        }
        #lds-roller div {
            animation: lds-roller 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            transform-origin: 40px 40px;
        }
        #lds-roller div:after {
            content: " ";
            display: block;
            position: absolute;
            width: 7.2px;
            height: 7.2px;
            border-radius: 50%;
            background: currentColor;
            margin: -3.6px 0 0 -3.6px;
        }
        #lds-roller div:nth-child(1) {
            animation-delay: -0.036s;
        }
        #lds-roller div:nth-child(1):after {
            top: 62.62742px;
            left: 62.62742px;
        }
        #lds-roller div:nth-child(2) {
            animation-delay: -0.072s;
        }
        #lds-roller div:nth-child(2):after {
            top: 67.71281px;
            left: 56px;
        }
        #lds-roller div:nth-child(3) {
            animation-delay: -0.108s;
        }
        #lds-roller div:nth-child(3):after {
            top: 70.90963px;
            left: 48.28221px;
        }
        #lds-roller div:nth-child(4) {
            animation-delay: -0.144s;
        }
        #lds-roller div:nth-child(4):after {
            top: 72px;
            left: 40px;
        }
        #lds-roller div:nth-child(5) {
            animation-delay: -0.18s;
        }
        #lds-roller div:nth-child(5):after {
            top: 70.90963px;
            left: 31.71779px;
        }
        #lds-roller div:nth-child(6) {
            animation-delay: -0.216s;
        }
        #lds-roller div:nth-child(6):after {
            top: 67.71281px;
            left: 24px;
        }
        #lds-roller div:nth-child(7) {
            animation-delay: -0.252s;
        }
        #lds-roller div:nth-child(7):after {
            top: 62.62742px;
            left: 17.37258px;
        }
        #lds-roller div:nth-child(8) {
            animation-delay: -0.288s;
        }
        #lds-roller div:nth-child(8):after {
            top: 56px;
            left: 12.28719px;
        }
        @keyframes lds-roller {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    {% if auth_error %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <strong>{{auth_error}}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endif %}

        <div id="lds-roller"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
        <section id="head">
            <div class="header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt=""></a>
               
            </div>
        </section>
        <section class="forms-section">
          
            <h1 class="section-title">LinkUp</h1>
    
            <p>Enter your personal details and start your journey with LinkUp today.</p></div>
            <div class="forms">
                <div class="form-wrapper is-active">
                    <button type="button" class="switcher switcher-login">
                        Login
                        <span class="underline"></span>
                    </button>
                    <form class="form form-login" method="POST" action="{{ url_for('login') }}">
                        <fieldset>
                            <legend>Please, enter your email and password for login.</legend>
                            <div class="input-block">
                                <label for="login-email">E-mail</label>
                                <input id="login-email" type="email" name="email" required>
                            </div>
                            <div class="input-block">
                                <label for="login-password">Password</label>
                                <input id="login-password" type="password" name="password" required>
                            </div>
                        </fieldset>
                        <button type="submit" class="btn-login">Login</button>
                    </form>
                </div>
                <div class="form-wrapper">
                    <button type="button" class="switcher switcher-signup">
                        Sign Up
                        <span class="underline"></span>
                    </button>
                    <form class="form form-signup" method="POST" action="{{ url_for('signup') }}" id="signup-form">
                        <fieldset>
                            <legend>Please, enter your email, password and password confirmation for sign up.</legend>
                            <div class="input-block">
                                <label for="signup-username">Username</label>
                                <input id="signup-username" type="text" name="username" required>
                            </div>
                            <div class="input-block">
                                <label for="signup-email">E-mail</label>
                                <input id="signup-email" type="email" name="email" required>
                            </div>
                            <div class="input-block">
                                <label for="signup-password">Password</label>
                                <input id="signup-password" type="password" name="password" required>
                            </div>
                        </fieldset>
                        <button type="submit" class="btn-signup" id="signup">Sign Up</button>
                    </form>
                </div>
            </div>
        </section>
    
   
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        document.getElementById('signup-form').onsubmit = function() {
            document.getElementById('lds-roller').style.display = 'block';
        };
    </script>
</body>

</html>
